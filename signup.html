<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - StockSense</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee8df;
            color: #41473d;
        }

        .signup-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .signup-card {
            background: #faf6ef;
            border: 1px solid #d6cec1;
            border-radius: 18px;
            padding: 38px;
            box-shadow: 0 10px 30px rgba(70, 65, 55, 0.10);
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            border-radius: 15px;
            background: #c5d0bd;
            color: #4d5b47;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #4b5747;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #77766d;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #55584f;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cfc6b8;
            border-radius: 9px;
            background: #f1ece4;
            color: #41473d;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #98aa8e;
            background: #faf6ef;
            box-shadow: 0 0 0 3px rgba(152, 170, 142, 0.15);
        }

        .signup-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #98aa8e;
            color: #364132;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 4px;
        }

        .signup-btn:hover {
            background: #899b80;
        }

        .flash {
            padding: 11px 13px;
            border-radius: 9px;
            margin-bottom: 15px;
            font-size: 13px;
            background: #ead5d1;
            color: #805952;
            border: 1px solid #dbc0bb;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #77766d;
        }

        .login-link a {
            color: #64745c;
            font-weight: 700;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="signup-container">

    <div class="signup-card">

        <div class="logo">S</div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your StockSense account
        </p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('signup') }}">

            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    minlength="6"
                    required
                >
            </div>

            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </div>

    </div>

</div>

</body>
</html>
